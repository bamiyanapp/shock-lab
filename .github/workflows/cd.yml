name: CD
run-name: CD ${{ github.event.head_commit.message }}

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    uses: bamiyanapp/dev-standards/.github/workflows/reusable-cd.yml@v2.60.0
    with:
      enable_shared_release_config: true
    secrets:
      BOT_TOKEN: ${{ secrets.BOT_TOKEN }}

  deploy:
    needs: release
    if: success() && needs.release.outputs.new_release_published == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page-url }}
    permissions:
      pages: write
      id-token: write
    steps:
      # releaseジョブがバージョン更新コミットをmainへ直接pushしているため、
      # このワークフローの発端になったコミット（github.sha、refを省略した場合の
      # デフォルト）ではなく、semantic-releaseでバージョン更新が反映された実際の
      # コミット（release_commit_sha）を明示的に取得する。省略するとビルドに
      # 埋め込まれるバージョン表示（__APP_VERSION__、getAppVersionDefine.js）が
      # 常に1つ前のリリースのままになる
      # （bamiyanapp/dev-standards#635、docs/cicd-pipeline-specification.md「5.」参照）
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.release.outputs.release_commit_sha }}
          submodules: true
      - name: Deploy to GitHub Pages
        id: deploy
        uses: bamiyanapp/dev-standards/.github/actions/deploy-github-pages@v2.60.0
        with:
          working-directory: frontend
          artifact-path: frontend/dist
