name: CI
run-name: CI ${{ github.event.head_commit.message || github.event.pull_request.title }}

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  ci:
    uses: bamiyanapp/dev-standards/.github/workflows/reusable-ci.yml@v2.123.2
    with:
      # self_ref省略時はcoverage_threshold等のチェックが警告のみでスキップされるため、
      # usesのタグと同じ値を明示する（dev-standards docs/reusable-workflows-reference.md参照）。
      # Renovateはuses:のタグ更新時にこの値までは追従しないため、renovate.jsonの
      # customManagersでself_ref行も追従対象にしている（dev-standards#1316）。
      self_ref: v2.123.0
      # frontend単一パッケージ構成のため、backend-test固定ジョブを避けるためにpackages構成を使う。
      # node_version: jsdom v30がNode.js組み込みundiciのwebidl API（Node.js 22以降で提供）に
      # 依存するため、既定の20では`webidl.util.markAsUncloneable is not a function`で
      # テストがクラッシュする（issue #143）。
      packages: '[{"dir":"frontend","build":true,"coverage_threshold":70,"node_version":22}]'
      enable_standards_check: true
      enable_duplication_check: true
      # frontend/e2eのPlaywrightテストを実行し、frontend/e2e-screenshots/へ書き出した
      # スクリーンショットをJob Summary・PRコメントへ画像として直接埋め込む
      # （開発環境の制約「スマホオンリー」対応、issue #105）。
      enable_e2e_test: true
      # Renovate等が作成した依存更新PRへ、適用リスク・維持リスク判定（Risk Summary）を
      # PRコメントへ投稿する（モダナイズ観点「依存更新の運用・SBOM」、issue #404）。
      # dependency-risk-summary job自体が要求する権限（pull-requests: write・issues: write）は
      # 本ファイル冒頭のpermissions:で既に許可済みのため、追加の権限変更は不要。
      enable_dependency_risk_summary: true
      # squash merge運用（enable_auto_merge）のため、pull_requestイベントで既に検証済みの
      # 内容をpushイベント（squash merge後のmainへのpush）で再検証しない（issue #149）。
      # 「base_branchと同期済みでないとマージ不可」（up-to-date required）のブランチ保護が
      # 前提。この前提が崩れている場合はfalseへ戻すこと。
      skip_verification_on_push: true
    secrets:
      # mergeジョブのスカッシュマージをBOT_TOKENで行わないと、GITHUB_TOKENによる
      # pushはGitHub Actions上で新たなワークフロー実行のトリガーにならず、
      # mainへのpushイベントが発生せずcd.ymlが起動しない（未設定時はGITHUB_TOKENに
      # フォールバックする）。
      BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
