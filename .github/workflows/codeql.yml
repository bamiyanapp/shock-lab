name: CodeQL
run-name: CodeQL ${{ github.event.head_commit.message || github.event.pull_request.title }}

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    # 毎週月曜4:00 UTC（コード変更が無い期間もクエリセット更新を検知するため）
    - cron: "0 4 * * 1"

jobs:
  codeql:
    uses: bamiyanapp/dev-standards/.github/workflows/reusable-codeql.yml@v2.121.0
    # SARIFのGitHub Securityタブへのアップロードにはsecurity-events: writeが必要。
    # 省略するとリポジトリ既定の権限（これを含まない）が上限になりstartup_failureになる
    # （dev-standards docs/code-quality-conventions.md「CodeQL」・issue #399参照）。
    permissions:
      security-events: write
      actions: read
      contents: read
